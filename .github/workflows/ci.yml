name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Proves the `engines.node` claim of >=18 across the range consumers may be
  # on. Deliberately does NOT install: the suite requires only Node builtins
  # (the single runtime dep, `prompts`, is used by src/ but not exercised by
  # any test), and pnpm itself needs Node >=22.13 so it could not run on the
  # lower versions anyway. Keep it that way — if a test ever needs a dependency,
  # move it to the `install` job rather than adding pnpm here.
  engines:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # Validates that the lockfile resolves and the suite still passes with the
  # dependencies actually installed — the thing the matrix above cannot check.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
