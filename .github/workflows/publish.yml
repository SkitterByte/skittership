name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# id-token: write is what lets npm authenticate this workflow via OIDC
# (Trusted Publishing). No NPM_TOKEN secret is involved, so the account's
# two-factor requirement on writes does not apply to this job.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately NO registry-url. Passing it makes setup-node write an
      # .npmrc containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`,
      # and with no token in the environment that resolves to an empty token.
      # npm then treats the registry as token-authenticated, never performs the
      # OIDC exchange, and the registry rejects the anonymous PUT as a 404.
      # Trusted Publishing needs npm to find NO credentials at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Staged publishing needs npm >= 11.15.0 (trusted publishing alone needs
      # only 11.5.1); Node 22 still bundles npm 10.x. node-version '22' resolves
      # to the latest 22.x, comfortably above the required 22.14.0.
      - name: Upgrade npm
        run: npm install -g npm@latest

      # Surfaced so a future auth failure is diagnosable from the log alone:
      # the npm version actually in use, and proof no credentials are present.
      - name: Report publish environment
        run: |
          echo "npm: $(npm --version)  (staged publishing needs >= 11.15.0)"
          for f in .npmrc "$HOME/.npmrc"; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              sed -E 's/(_authToken=).*/\1<redacted>/' "$f"
            else
              echo "--- $f: absent (expected) ---"
            fi
          done

      - run: npm ci

      # A tag that disagrees with package.json means the version commit and the
      # tag came apart. Publishing that ships a package whose version is not the
      # one that was reviewed, so stop before the registry sees it.
      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # npm generates provenance automatically under Trusted Publishing.
      # Not redundant with prepublishOnly: it is undocumented whether that
      # hook fires for `npm stage publish`, and an unverified build must not
      # reach the staging area. The suite runs in under a second.
      - run: npm test

      # Stage rather than publish. The trusted publisher is stage-only, so the
      # build waits in the staging area until a maintainer approves it with 2FA
      # (`npm stage approve`, or on npmjs.com). See CLAUDE.md, "Releasing this
      # package" — a staged release is NOT live until approved.
      - run: npm stage publish
